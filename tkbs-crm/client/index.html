<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TKBS CRM</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F7F8FA; color: #1B2838; }
    a { color: inherit; text-decoration: none; }

    /* Indeterminate striped progress for long-running async actions
       (Brand Profile extraction, Whisper transcription). */
    @keyframes tkbs-stripe { from { background-position: 0 0; } to { background-position: 30px 0; } }
    .tkbs-busy {
      background-image: linear-gradient(
        45deg,
        rgba(255,255,255,0.25) 25%, transparent 25%,
        transparent 50%, rgba(255,255,255,0.25) 50%,
        rgba(255,255,255,0.25) 75%, transparent 75%, transparent
      );
      background-size: 30px 30px;
      animation: tkbs-stripe 1s linear infinite;
    }
    @keyframes tkbs-bar-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
    .tkbs-bar-track { position: relative; overflow: hidden; height: 3px; background: #E2E6EB; border-radius: 2px; }
    .tkbs-bar-fill {
      position: absolute; top: 0; left: 0; height: 100%; width: 25%;
      background: #00D4AA; border-radius: 2px;
      animation: tkbs-bar-slide 1.4s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
